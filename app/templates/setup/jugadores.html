{% extends "layout/base.html" %}

{% block title %}Nombrar Jugadores | Sospecha{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jugadores.css') }}">
{% endblock %}

{% block content %}
<section class="players-card" aria-labelledby="players-title">
    <nav class="wizard-steps" aria-label="Progreso de configuración">
        <div class="step-item step-completed">
            <span class="step-bubble">✓</span>
            <span class="step-text">Reglas</span>
        </div>
        <div class="step-line"></div>
        <div class="step-item step-active">
            <span class="step-bubble">2</span>
            <span class="step-text">Nombres</span>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
            <span class="step-bubble">3</span>
            <span class="step-text">Roles</span>
        </div>
    </nav>

    <header class="players-header">
        <a href="{{ url_for('game.configurar') }}" class="btn-back" aria-label="Volver a configuración">
            <span aria-hidden="true">←</span> Configuración
        </a>
        <h1 id="players-title" class="players-title">JUGADORES</h1>
        <p class="players-subtitle">Escribe el nombre o alias de los <span id="players-count"></span> jugadores</p>
    </header>

    <form id="players-form" class="players-form" data-config-url="{{ url_for('game.configurar') }}" data-next-url="{{ url_for('game.roles') }}">
        <p id="players-error" class="form-error view-hidden" role="alert"></p>

        <div id="players-list" class="players-list" role="list"></div>

        <div class="action-container">
            <button type="submit" class="btn-primary">
                <span class="btn-text">REPARTIR ROLES</span>
                <span class="btn-icon" aria-hidden="true">➔</span>
            </button>
        </div>
    </form>
</section>
{% endblock %}

{% block extra_js %}
    <script src="{{ url_for('static', filename='js/modo-local.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/jugadores.js') }}" defer></script>
{% endblock %}
