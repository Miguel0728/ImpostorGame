{% extends "layout/base.html" %}

{% block title %}Veredicto | Sospecha{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/resultado.css') }}">
{% endblock %}

{% block content %}
<section class="result-viewport" aria-labelledby="verdict-title"
         data-home-url="{{ url_for('home.index') }}"
         data-next-url="{{ url_for('game.roles') }}">
    <article id="verdict-card" class="verdict-card view-hidden">
        <header class="verdict-header">
            <div class="round-pill-badge">
                <span id="result-round"></span>
            </div>

            <div id="result-icon" class="verdict-badge-icon" aria-hidden="true"></div>

            <span id="result-kicker" class="verdict-kicker"></span>

            <h1 id="verdict-title" class="verdict-title"></h1>
        </header>

        <div class="verdict-details">
            <!-- Sospechoso más votado -->
            <div class="detail-box">
                <span class="detail-label">MÁS VOTADO POR EL GRUPO:</span>
                <p id="result-voted" class="detail-highlight"></p>
            </div>

            <!-- Identidad real de los impostores -->
            <div class="detail-box">
                <span id="result-impostors-label" class="detail-label"></span>
                <p id="result-impostors" class="detail-impostor"></p>
            </div>

            <!-- Impostores que siguen libres (solo pierde el descubierto) -->
            <div id="result-free-box" class="detail-box view-hidden">
                <span class="detail-label">SIGUEN LIBRES:</span>
                <p id="result-free" class="detail-impostor"></p>
            </div>

            <!-- Palabra secreta -->
            <div class="detail-box">
                <span class="detail-label">LA PALABRA SECRETA ERA:</span>
                <p id="result-word" class="detail-word"></p>
            </div>
        </div>

        <p id="result-error" class="form-error view-hidden" role="alert"></p>

        <div class="result-actions">
            <!-- Si aún quedan rondas en la partida -->
            <button id="btn-next-round" type="button" class="btn-primary view-hidden">
                <span class="btn-icon" aria-hidden="true">➔</span>
                <span id="btn-next-round-text" class="btn-text"></span>
            </button>
            <!-- Si es la última ronda de la partida -->
            <a id="btn-play-again" href="{{ url_for('game.configurar') }}" class="btn-primary view-hidden">
                <span class="btn-icon" aria-hidden="true">🔄</span>
                <span class="btn-text">JUGAR DE NUEVO</span>
            </a>
            <a id="btn-exit" href="{{ url_for('home.index') }}" class="btn-secondary">
                <span id="btn-exit-text" class="btn-text"></span>
            </a>
        </div>
    </article>
</section>
{% endblock %}

{% block extra_js %}
    <script src="{{ url_for('static', filename='js/modo-local.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/resultado.js') }}" defer></script>
{% endblock %}
